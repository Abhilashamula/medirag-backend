spring.application.name=medirag-backend
server.port=8081

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/medirag_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# File Size Properties
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tesseract OCR Configuration
medirag.ocr.tesseract-command=C:/Program Files/Tesseract-OCR/tesseract.exe
medirag.ocr.language=eng
medirag.ocr.timeout-seconds=60
medirag.ocr.max-pdf-pages=30

# Local Ollama configuration
medirag.ollama.base-url=http://localhost:11434
medirag.ollama.chat-model=llama3.2
medirag.ollama.embedding-model=nomic-embed-text

# Retrieval settings
medirag.rag.top-k=5
medirag.rag.similarity-threshold=0.5


# ==========================================
# ADVANCED LAYOUT-AWARE OCR
# ==========================================

medirag.ocr.low-confidence-threshold=70

medirag.ocr.max-image-pixels=25000000

medirag.ocr.layout-dpi=300


# ==========================================
# TABLE RECONSTRUCTION CONFIGURATION
# ==========================================

medirag.table.max-row-gap-factor=6

medirag.table.header-gap-factor=1.5

# ==========================================
# ADVANCED DOCUMENT EXTRACTION
# ==========================================

medirag.extraction.advanced-pdf-ocr=true

# ==========================================
# OCR CONFIGURATION
# ==========================================

medirag.ocr.layout-dpi=300
medirag.ocr.max-image-pixels=25000000
medirag.ocr.max-pdf-pages=30
medirag.ocr.low-confidence-threshold=70


# ==========================================
# OPENCV GRID TABLE DETECTION
# ==========================================

medirag.table.grid.horizontal-scale=40

medirag.table.grid.vertical-scale=100

medirag.table.grid.min-width-ratio=0.15

medirag.table.grid.min-height=30

medirag.table.grid.line-coverage=0.65

medirag.table.grid.merge-distance=6



# ==========================================
# CELL LEVEL OCR CONFIGURATION
# ==========================================

medirag.ocr.cell.border-inset=5

medirag.ocr.cell.padding=15

medirag.ocr.cell.upscale=2

medirag.ocr.cell.blank-threshold=0.001

medirag.ocr.cell.timeout-seconds=15

medirag.ocr.cell.max-cells-per-page=300



