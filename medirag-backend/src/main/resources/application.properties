spring.application.name=medirag-backend
server.port=8081

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/medirag_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# File Size Properties
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tesseract OCR Configuration
medirag.ocr.tesseract-command=C:/Program Files/Tesseract-OCR/tesseract.exe
medirag.ocr.language=eng
medirag.ocr.timeout-seconds=60
medirag.ocr.max-pdf-pages=30

# Local Ollama configuration
medirag.ollama.base-url=http://localhost:11434
medirag.ollama.chat-model=llama3.2
medirag.ollama.embedding-model=nomic-embed-text

# Retrieval settings
medirag.rag.top-k=5
medirag.rag.similarity-threshold=0.5